name: SkillProof v2 public Studionet proof
on:
  # Explicit manual testnet action only; no repeat deployments on push.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'genlayer-py @ git+https://github.com/genlayerlabs/genlayer-py@v0.18' 'genlayer-test @ git+https://github.com/genlayerlabs/genlayer-testing-suite@v0.29'
      - name: Prove source revision
        run: |
          echo "COMMIT=${GITHUB_SHA}"
          sha256sum contracts/*.py
      - name: Run full fresh v2 two-account proof with safe 504 receipt retries
        run: gltest tests/integration/test_studionet.py -v -s --network studionet

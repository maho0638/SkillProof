name: SkillProof v2 public Studionet proof
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    # Single authorized push; future routine commits cannot cause testnet transactions.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_ONCE_SKILLPROOF_V2_STUDIONET_PROOF') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'genlayer-py @ git+https://github.com/genlayerlabs/genlayer-py@v0.18' 'genlayer-test @ git+https://github.com/genlayerlabs/genlayer-testing-suite@v0.29'
      - name: Prove source revision
        run: |
          echo "COMMIT=${GITHUB_SHA}"
          sha256sum contracts/*.py
      - name: Deploy and execute FULL two-account lifecycle on Studionet
        run: gltest tests/integration/test_studionet.py -v -s --network studionet
